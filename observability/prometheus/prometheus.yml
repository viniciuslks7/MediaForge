global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: worker-image
    static_configs:
      - targets: ["worker-image:9102"]

  - job_name: worker-ocr
    static_configs:
      - targets: ["worker-ocr:9103"]

  - job_name: realtime-gateway
    static_configs:
      - targets: ["realtime-gateway:8090"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]   # requires rabbitmq_prometheus plugin
