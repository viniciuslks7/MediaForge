name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, worker-image]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -count=1 ./...

  python:
    name: Python (worker-ocr)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker-ocr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  node:
    name: Node (realtime-gateway)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/realtime-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/realtime-gateway/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm test

  docker:
    name: Build images
    needs: [go, python, node]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, worker-image, worker-ocr, realtime-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          tags: mediaforge-${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
