name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, worker-image]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -count=1 ./...

  python:
    name: Python (worker-ocr)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker-ocr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  node:
    name: Node (realtime-gateway)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/realtime-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/realtime-gateway/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm test

  spec-lint:
    name: Contracts (AsyncAPI + OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate AsyncAPI
        run: npx -y @asyncapi/cli@latest validate specs/asyncapi.yaml
      - name: Lint OpenAPI
        run: npx -y @redocly/cli@latest lint specs/openapi.yaml --config specs/redocly.yaml

  manifests:
    name: Manifests (kustomize + helm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform (pinned + checksum-verified)
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Validate kustomize base
        run: kubectl kustomize deploy/k8s/base | kubeconform -strict -summary -ignore-missing-schemas
      - name: Helm lint
        run: helm lint deploy/helm/mediaforge
      - name: Validate rendered Helm chart
        run: helm template mediaforge deploy/helm/mediaforge | kubeconform -strict -summary -ignore-missing-schemas

  images:
    name: Image build + scan (${{ matrix.service }})
    needs: [go, python, node, spec-lint]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, worker-image, worker-ocr, realtime-gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          load: true
          push: false
          tags: mediaforge-${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Fail the build on fixable HIGH/CRITICAL CVEs in the image.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: mediaforge-${{ matrix.service }}:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library
      # Produce a CycloneDX SBOM and keep it as a build artifact (provenance).
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: mediaforge-${{ matrix.service }}:ci
          format: cyclonedx
          output: sbom-${{ matrix.service }}.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cdx.json
          if-no-files-found: error

  iac-scan:
    name: IaC & Dockerfile misconfig (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Report-only for now: surfaces Dockerfile/k8s misconfigurations without
      # gating the build. Flip exit-code to "1" once the backlog is triaged.
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL
