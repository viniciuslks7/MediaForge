# MediaForge — full local stack.
# Usage: cp .env.example .env && docker compose up --build
name: mediaforge

x-restart: &restart
  restart: unless-stopped

services:
  # ────────────────────────── Infrastructure ──────────────────────────
  postgres:
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mediaforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediaforge}
      POSTGRES_DB: ${POSTGRES_DB:-mediaforge}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mediaforge}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    <<: *restart
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    <<: *restart
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    <<: *restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # one-shot: create the bucket on first boot
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb -p local/${S3_BUCKET:-mediaforge} &&
      mc anonymous set download local/${S3_BUCKET:-mediaforge} &&
      echo 'bucket ready';
      "

  # ────────────────────────── Application ──────────────────────────
  api-gateway:
    build: ./services/api-gateway
    <<: *restart
    env_file: .env
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }

  worker-image:
    build: ./services/worker-image
    <<: *restart
    env_file: .env
    ports: ["9102:9102"]
    deploy:
      replicas: 2
    depends_on:
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
      postgres: { condition: service_healthy }

  worker-ocr:
    build: ./services/worker-ocr
    <<: *restart
    env_file: .env
    ports: ["9103:9103"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
      postgres: { condition: service_healthy }

  realtime-gateway:
    build: ./services/realtime-gateway
    <<: *restart
    env_file: .env
    ports: ["8090:8090"]
    depends_on:
      rabbitmq: { condition: service_healthy }

  # ────────────────────────── Observability ──────────────────────────
  prometheus:
    image: prom/prometheus:latest
    <<: *restart
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro

  grafana:
    image: grafana/grafana:latest
    <<: *restart
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3000:3000"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  pgdata:
  rabbitmqdata:
  miniodata:
