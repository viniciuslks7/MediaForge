[project]
name = "mediaforge-ocr"
version = "0.1.0"
description = "MediaForge OCR worker — consumes OCR jobs from RabbitMQ and extracts text with Tesseract."
requires-python = ">=3.11"
dependencies = [
    "pika>=1.3.2",
    "minio>=7.2.7",
    "psycopg[binary]>=3.2.1",
    "psycopg-pool>=3.2.2",
    "pytesseract>=0.3.13",
    "Pillow>=10.4.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[project.scripts]
mediaforge-ocr = "mediaforge_ocr.worker:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mediaforge_ocr*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
