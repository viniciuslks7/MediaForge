# MediaForge web — single-origin reverse proxy.
# Serves the built SPA and proxies the API, the WebSocket and MinIO so the
# browser only ever talks to one origin (no CORS, no backend changes).
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # gzip for the static bundle
    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # REST + liveness → api-gateway
    location /v1/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # large uploads (gateway caps at API_MAX_UPLOAD_BYTES)
        client_max_body_size 32m;
    }
    location = /healthz {
        proxy_pass http://api-gateway:8080;
    }

    # WebSocket → realtime-gateway (live job events)
    location /ws {
        proxy_pass http://realtime-gateway:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # Artifact download → MinIO. Presigned URLs are signed for Host "minio:9000",
    # so we strip /s3 and force that Host upstream to keep the signature valid.
    location /s3/ {
        rewrite ^/s3/(.*)$ /$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host minio:9000;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
