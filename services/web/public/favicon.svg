<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffce6a"/>
      <stop offset="0.5" stop-color="#ffa53b"/>
      <stop offset="1" stop-color="#ff6a1a"/>
