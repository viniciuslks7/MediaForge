apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-ocr
  namespace: mediaforge
  labels: { app.kubernetes.io/name: worker-ocr, app.kubernetes.io/part-of: mediaforge }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: worker-ocr }
  template:
    metadata:
      labels: { app.kubernetes.io/name: worker-ocr }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9103"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker-ocr
          image: ghcr.io/viniciusoliveira/mediaforge-worker-ocr:latest
          ports:
            - { name: metrics, containerPort: 9103 }
          envFrom:
            - configMapRef: { name: mediaforge-config }
            - secretRef: { name: mediaforge-secret }
          env:
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318" }  # Python → OTLP/HTTP
            - { name: OTEL_SERVICE_NAME, value: "worker-ocr" }
          resources:
            requests: { cpu: "250m", memory: "384Mi" }
            limits: { cpu: "1", memory: "768Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: worker-ocr
  namespace: mediaforge
  labels: { app.kubernetes.io/name: worker-ocr }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: worker-ocr }
  ports:
    - { name: metrics, port: 9103, targetPort: metrics }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-ocr
  namespace: mediaforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker-ocr
  minReplicas: 2
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
