# Minimal in-cluster infrastructure for demos / non-prod environments.
# For production, prefer managed services (RDS, ElastiCache, Amazon MQ, S3) or
# dedicated operators (CloudNativePG, RabbitMQ Cluster Operator).
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: mediaforge }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: postgres } }
  template:
    metadata: { labels: { app.kubernetes.io/name: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef: { name: mediaforge-secret }
          env:
            - { name: POSTGRES_DB, value: mediaforge }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: mediaforge }
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: mediaforge }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: redis } }
  template:
    metadata: { labels: { app.kubernetes.io/name: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: mediaforge }
spec:
  selector: { app.kubernetes.io/name: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq, namespace: mediaforge }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: rabbitmq } }
  template:
    metadata: { labels: { app.kubernetes.io/name: rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: mgmt, containerPort: 15672 }
            - { name: metrics, containerPort: 15692 }
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq, namespace: mediaforge }
spec:
  selector: { app.kubernetes.io/name: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
    - { name: mgmt, port: 15672, targetPort: mgmt }
    - { name: metrics, port: 15692, targetPort: metrics }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio, namespace: mediaforge }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: minio } }
  template:
    metadata: { labels: { app.kubernetes.io/name: minio } }
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - { name: MINIO_ROOT_USER, value: minioadmin }
            - { name: MINIO_ROOT_PASSWORD, value: minioadmin }
          ports:
            - { name: s3, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: minio, namespace: mediaforge }
spec:
  selector: { app.kubernetes.io/name: minio }
  ports:
    - { name: s3, port: 9000, targetPort: s3 }
    - { name: console, port: 9001, targetPort: console }
