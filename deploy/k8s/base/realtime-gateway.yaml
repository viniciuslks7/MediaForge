apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-gateway
  namespace: mediaforge
  labels: { app.kubernetes.io/name: realtime-gateway, app.kubernetes.io/part-of: mediaforge }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: realtime-gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: realtime-gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
    spec:
      containers:
        - name: realtime-gateway
          image: ghcr.io/viniciuslks7/mediaforge-realtime-gateway:latest
          ports:
            - { name: http, containerPort: 8090 }
          envFrom:
            - configMapRef: { name: mediaforge-config }
            - secretRef: { name: mediaforge-secret }
          env:
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318" }  # Node → OTLP/HTTP
            - { name: OTEL_SERVICE_NAME, value: "realtime-gateway" }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: realtime-gateway
  namespace: mediaforge
  labels: { app.kubernetes.io/name: realtime-gateway }
spec:
  selector: { app.kubernetes.io/name: realtime-gateway }
  ports:
    - { name: http, port: 8090, targetPort: http }
