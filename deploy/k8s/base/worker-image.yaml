apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-image
  namespace: mediaforge
  labels: { app.kubernetes.io/name: worker-image, app.kubernetes.io/part-of: mediaforge }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: worker-image }
  template:
    metadata:
      labels: { app.kubernetes.io/name: worker-image }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9102"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker-image
          image: ghcr.io/viniciusoliveira/mediaforge-worker-image:latest
          ports:
            - { name: metrics, containerPort: 9102 }
          envFrom:
            - configMapRef: { name: mediaforge-config }
            - secretRef: { name: mediaforge-secret }
          env:
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "otel-collector:4317" }  # Go → OTLP/gRPC
            - { name: OTEL_SERVICE_NAME, value: "worker-image" }
          readinessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
---
# Workers expose metrics so Prometheus can scrape queue-depth-derived signals.
apiVersion: v1
kind: Service
metadata:
  name: worker-image
  namespace: mediaforge
  labels: { app.kubernetes.io/name: worker-image }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: worker-image }
  ports:
    - { name: metrics, port: 9102, targetPort: metrics }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-image
  namespace: mediaforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker-image
  minReplicas: 2
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
    # Scale on RabbitMQ queue depth via the Prometheus adapter (custom metric).
    # Requires prometheus-adapter exposing `rabbitmq_queue_messages_ready`.
    - type: Pods
      pods:
        metric: { name: rabbitmq_queue_messages_ready }
        target: { type: AverageValue, averageValue: "30" }
