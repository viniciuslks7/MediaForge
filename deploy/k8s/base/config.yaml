apiVersion: v1
kind: ConfigMap
metadata:
  name: mediaforge-config
  namespace: mediaforge
data:
  API_HTTP_ADDR: ":8080"
  API_MAX_UPLOAD_BYTES: "26214400"
  REDIS_ADDR: "redis:6379"
  RABBITMQ_PREFETCH: "16"
  RABBITMQ_MAX_RETRIES: "5"
  RABBITMQ_RETRY_TTL_MS: "10000"
  S3_ENDPOINT: "minio:9000"
  S3_BUCKET: "mediaforge"
  S3_USE_SSL: "false"
  S3_REGION: "us-east-1"
  IMAGE_METRICS_ADDR: ":9102"
  IMAGE_THUMBNAIL_SIZE: "256"
  IMAGE_RESIZE_MAX_DIM: "1600"
  OCR_METRICS_PORT: "9103"
  OCR_LANGUAGES: "eng+por"
  OCR_TESSERACT_CMD: "tesseract"
  RT_HTTP_PORT: "8090"
  RT_METRICS_PATH: "/metrics"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "mediaforge"
  # Distributed tracing (shared). Per-service OTEL_EXPORTER_OTLP_ENDPOINT and
  # OTEL_SERVICE_NAME are set on each Deployment (Go uses gRPC :4317, Python/Node
  # use HTTP :4318).
  OTEL_TRACES_ENABLED: "true"
  OTEL_TRACES_SAMPLE_RATIO: "1.0"
  SERVICE_VERSION: "dev"
---
# Demo secret. In production, generate this with a SealedSecret / External Secrets
# operator — never commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: mediaforge-secret
  namespace: mediaforge
type: Opaque
stringData:
  API_AUTH_TOKEN: "change-me-in-prod"
  POSTGRES_USER: "mediaforge"
  POSTGRES_PASSWORD: "mediaforge"
  POSTGRES_DSN: "postgres://mediaforge:mediaforge@postgres:5432/mediaforge?sslmode=disable"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "minioadmin"
