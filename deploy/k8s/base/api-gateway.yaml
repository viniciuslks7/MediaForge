apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: mediaforge
  labels: { app.kubernetes.io/name: api-gateway, app.kubernetes.io/part-of: mediaforge }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: api-gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: api-gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/viniciusoliveira/mediaforge-api-gateway:latest
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: mediaforge-config }
            - secretRef: { name: mediaforge-secret }
          env:
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "otel-collector:4317" }  # Go → OTLP/gRPC
            - { name: OTEL_SERVICE_NAME, value: "api-gateway" }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: mediaforge
  labels: { app.kubernetes.io/name: api-gateway }
spec:
  selector: { app.kubernetes.io/name: api-gateway }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: mediaforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
